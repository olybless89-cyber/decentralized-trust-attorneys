# Nixpacks build configuration for Railway
# Forces PHP 8.2 — avoids the dropped php80 error.
# pdo_mysql, mbstring, fileinfo, openssl are compiled into php82 by default.
# composer.json declares zero vendor packages (only extensions), so there is
# nothing to install. We explicitly override the install phase to a no-op so
# Nixpacks never tries to auto-run a missing `composer install` binary.

[phases.setup]
nixPkgs = ["php82", "composer"]

[phases.install]
cmd = "true"

[start]
cmd = "php -S 0.0.0.0:$PORT"
